<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Scholar CRM | Outreach Intelligence</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-heading: 'Outfit', sans-serif;
            --primary: #de3850;
            --primary-light: #f17b8b;
            --bg-page: #fff5f6;
            --bg-card: #ffffff;
            --border: #fbebed;
            --text-main: #000000;
            --text-muted: #64748b;
            --success: #059669;
            --warning: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--bg-page); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        button, a { transition: all 0.2s ease; cursor: pointer; }
        .hidden { display: none !important; }

        /* --- Navbar --- */
        nav {
            height: 80px;
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0 4%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
        .brand-text { font-family: var(--font-heading); font-size: 20px; font-weight: 800; }

        .nav-controls { display: flex; align-items: center; gap: 16px; }
        
        /* --- Login --- */
        #login-wrap { position: fixed; inset: 0; background: var(--bg-page); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border: 1px solid var(--border); width: 400px; padding: 48px; border-radius: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); text-align: center; }

        /* --- Stats Box --- */
        .stats-wrap { padding: 16px 4%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stat-card { background: white; border: 1px solid var(--border); padding: 14px 18px; border-radius: 14px; display: flex; flex-direction: column; }
        .stat-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
        .stat-val { font-family: var(--font-heading); font-size: 22px; font-weight: 800; color: var(--primary); }

        /* --- Content Layout --- */
        .content { padding: 0 4% 80px; }
        
        .search-input { 
            background: white; 
            border: 1px solid var(--border); 
            padding: 12px 16px; 
            border-radius: 12px; 
            outline: none; 
            font-size: 14px;
            font-family: var(--font-sans);
        }
        .search-input:focus { border-color: var(--primary); }

        /* --- Nav Action Icons --- */
        .nav-icon { 
            width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); 
            background: white; color: var(--text-muted); cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
        }
        .nav-icon:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .nav-icon.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- Expandable Panels --- */
        .search-panel {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 4%;
            display: none;
            align-items: center;
            gap: 16px;
            animation: slideDown 0.2s ease;
        }
        .search-panel.open { display: flex; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .panel-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }

        .toggle-btn { background: white; border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--text-muted); }
        .toggle-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- Row-based Table --- */
        .directory-header { 
            display: grid; 
            grid-template-columns: 1.8fr 1.5fr 1.5fr 0.8fr 1.2fr 1.2fr 80px; 
            padding: 0 24px 16px; 
            font-size: 12px; 
            font-weight: 900; 
            color: #000; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }

        .prof-row {
            background: white;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 12px;
            padding: 10px 18px;
            display: grid;
            grid-template-columns: 1.5fr 1.2fr 1.2fr 1.5fr 0.8fr 1.2fr 1.2fr 80px;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        .prof-name { font-weight: 800; font-size: 14px; display: block; color: #000; }
        .prof-sub { font-size: 11px; color: #333; font-weight: 500; }

        .cell-text { font-size: 13px; font-weight: 600; color: #000; }
        .cell-tag { font-size: 12px; font-weight: 600; color: #000; }
        
        .copy-btn { background: none; border: none; padding: 2px; border-radius: 4px; color: var(--text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 3px; transition: all 0.2s; font-size: 10px; font-weight: 700; }
        .copy-btn:hover { color: var(--primary); }
        .copy-btn .copied-text { color: var(--success); font-size: 10px; font-weight: 700; }

        .cell-links { display: flex; gap: 12px; }
        .link-icon { color: var(--text-muted); }
        .link-icon:hover { color: var(--primary); }

        .card-label { 
            display: block; 
            font-size: 9px; 
            font-weight: 800; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 1px;
        }

        /* --- Outreach Button/Status --- */
        .mailed-btn { 
            background: white; 
            border: 1px solid var(--border); 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--warning); 
        }
        .mailed-btn:hover { background: #fffbeb; border-color: var(--warning); }
        
        .mailed-stamp { font-size: 11px; font-weight: 700; color: var(--success); display: flex; flex-direction: column; }
        .mailed-date { font-size: 10px; color: var(--text-muted); font-weight: 500; }
        .editable-status { cursor: pointer; position: relative; }
        .editable-status:hover { color: #ef4444; }
        .editable-status:hover .mailed-date { color: #f87171; }

        .reply-badge { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 4px 10px; border-radius: 6px; }
        .reply-summary { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; text-transform: uppercase; }
        .reply-btn { background: #f8fafc; border: 1px dashed var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 700; }
        .reply-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* --- Global Comps --- */
        .p-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .p-btn:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }

        .form-input { 
            width: 100%; 
            background: #f1f5f9; 
            border: 1px solid #e2e8f0; 
            padding: 12px 14px; 
            border-radius: 10px; 
            outline: none; 
            font-size: 14px; 
            font-family: var(--font-sans); 
        }
        .form-input:focus { border-color: var(--primary); background: white; }

        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(8px); 
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; 
        }
        .modal { background: white; width: 100%; max-width: 700px; border-radius: 28px; padding: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .modal-title { font-family: var(--font-heading); font-size: 24px; font-weight: 800; margin-bottom: 32px; }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 1000px) {
            .directory-header { display: none !important; }
            nav { height: 60px; padding: 0 16px; }
            .content { padding: 0 12px 60px; }
            .brand-text { display: none; }
            .nav-controls { gap: 8px; }
            
            /* Mini Stats Dashboard */
            .stats-wrap { grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; }
            .stat-card { padding: 8px; border-radius: 8px; text-align: center; }
            .stat-val { font-size: 14px !important; }
            .stat-label { font-size: 8px !important; }

            /* Ultra-Compact Profiler Rows */
            .prof-row {
                grid-template-columns: 1fr auto;
                grid-template-rows: repeat(5, auto);
                gap: 4px 10px;
                padding: 10px;
                border-radius: 12px;
                margin-bottom: 8px;
                min-height: unset;
            }
            .prof-row > div { border: none !important; padding: 0 !important; margin: 0 !important; }

            /* Mobile Grid Placement */
            .prof-row > div:nth-child(1) { grid-column: 1 / 3; grid-row: 1; margin-bottom: 4px; } /* Identity */
            .prof-row > div:nth-child(2) { grid-column: 1; grid-row: 2; } /* Uni */
            .prof-row > div:nth-child(3) { grid-column: 1 / 3; grid-row: 3; } /* Area */
            .prof-row > div:nth-child(4) { grid-column: 1 / 3; grid-row: 4; } /* Email */
            
            .prof-row > div:nth-child(5) { grid-column: 2; grid-row: 2; justify-content: flex-end; display: flex; flex-direction: column; align-items: flex-end; } /* Links */
            .prof-row > div:nth-child(6) { grid-column: 1; grid-row: 5; justify-content: flex-start; display: flex; flex-direction: column; } /* Mailed */
            .prof-row > div:nth-child(7) { grid-column: 2; grid-row: 5; justify-content: flex-start; display: flex; flex-direction: column; align-items: flex-end; } /* Reply */
            
            .prof-row > div:nth-child(8) { grid-column: 2; grid-row: 1; gap: 4px; display: flex; flex-direction: column; align-items: flex-end; } /* Actions */
            
            /* Mobile Micro Typography */
            .prof-name { font-size: 14px !important; }
            .prof-sub { font-size: 10px !important; display: block; margin: 0; }
            .cell-text { font-size: 11px !important; }
            .cell-tag { font-size: 10px !important; color: var(--text-main) !important; background: #f8fafc; padding: 2px 6px !important; border-radius: 4px; border: 1px solid var(--border); display: inline-block; }
            .copy-btn { font-size: 10px !important; padding: 2px !important; }
            
            .card-label { font-size: 9px !important; margin-bottom: 1px; }

            .mailed-stamp { 
                align-items: center; 
                flex-direction: row; 
                flex-wrap: wrap; 
                justify-content: flex-start; 
                gap: 4px; 
                line-height: 1;
            }
            .mailed-stamp i { margin: 0 !important; width: 12px !important; }
            .mailed-date { font-size: 9px !important; }
            .mailed-btn, .reply-btn { padding: 4px 10px !important; border-radius: 6px; font-size: 9px !important; }
            .reply-badge { font-size: 9px !important; padding: 2px 6px !important; }
            
            .link-icon i { width: 16px !important; }
            .toggle-btn { padding: 6px !important; border-radius: 8px; }
            .toggle-btn i { width: 14px !important; height: 14px !important;}
            
            /* Remove appended pseudo labels */
            .cell-text::before, .cell-tag::before, .copy-btn::before, .cell-links::before { content: none !important; }
            
            .grid-2 { grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
            .filters { margin-bottom: 12px; }
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION -->
    <div id="login-wrap">
        <div class="login-card">
            <div class="brand-logo" style="margin: 0 auto 24px; width: 48px; height: 48px;"><i data-lucide="shield-check"></i></div>
            <h1 class="brand-text" style="font-size: 24px; margin-bottom: 8px;">Scholar Outreach</h1>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 32px; font-weight: 600;">PORTFOLIO MANAGEMENT SYSTEM</p>
            <div style="text-align: left;">
                <div style="margin-bottom: 16px;">
                    <label class="form-label">System Admin Email</label>
                    <input type="email" id="l-email" class="form-input" placeholder="admin@gmail.com">
                </div>
                <div style="margin-bottom: 24px;">
                    <label class="form-label">Access Key</label>
                    <input type="password" id="l-pass" class="form-input" placeholder="••••••••">
                </div>
                <button id="l-btn" class="p-btn" style="width: 100%; justify-content: center; padding: 16px;">Identify & Initialize</button>
            </div>
        </div>
    </div>

    <!-- MAIN CRM APP -->
    <div id="app" class="hidden">
        <nav>
            <div class="brand">
                <div class="brand-logo"><i data-lucide="book-open" style="width: 20px;"></i></div>
                <span class="brand-text">My Professors</span>
            </div>
            
            <div style="display: flex; gap: 8px; margin-left: 24px;">
                <button class="nav-icon" id="btn-search" title="Keyword Search"><i data-lucide="search" style="width: 16px;"></i></button>
                <button class="nav-icon" id="btn-filter" title="Filter by Country & University"><i data-lucide="sliders-horizontal" style="width: 16px;"></i></button>
            </div>

            <div class="nav-controls">
                <div style="display: flex; background: #f1f5f9; padding: 4px; border-radius: 12px; gap: 4px;">
                    <button class="toggle-btn active" id="mode-view">View</button>
                    <button class="toggle-btn" id="mode-edit">Manage</button>
                </div>
                <button class="p-btn hidden" id="add-btn"><i data-lucide="plus"></i> New Scholar</button>
                <button class="toggle-btn" id="logout-btn" style="padding: 10px;"><i data-lucide="log-out" style="width: 16px;"></i></button>
            </div>
        </nav>

        <!-- SEARCH PANEL -->
        <div class="search-panel" id="panel-search">
            <span class="panel-label">Keyword</span>
            <input type="text" id="q" class="search-input" style="flex: 1;" placeholder="Search by name, university, research area...">
            <button class="nav-icon" onclick="clearSearch()" title="Clear"><i data-lucide="x" style="width: 14px;"></i></button>
        </div>

        <!-- FILTER PANEL -->
        <div class="search-panel" id="panel-filter">
            <span class="panel-label">Country</span>
            <select id="nav-country" class="search-input" style="min-width: 180px;">
                <option value="">All Countries</option>
            </select>
            <span class="panel-label">University</span>
            <select id="nav-uni" class="search-input" style="min-width: 200px;">
                <option value="">All Universities</option>
            </select>
            <button class="nav-icon" onclick="clearFilters()" title="Clear Filters"><i data-lucide="x" style="width: 14px;"></i></button>
        </div>

        <div class="stats-wrap">
            <div class="stat-card">
                <span class="stat-label">Total</span>
                <span class="stat-val" id="s-total">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Mailed</span>
                <span class="stat-val" id="s-mailed">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Replied</span>
                <span class="stat-val" id="s-replied">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Not Replied</span>
                <span class="stat-val" id="s-pending">0</span>
            </div>
        </div>

        <div class="content">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
                <div id="sync-ui" style="display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--success);">
                    <i data-lucide="cloud-check" style="width: 14px;"></i> Live
                </div>
            </div>

            <div id="list">
                <!-- Data Rows -->
            </div>
        </div>
    </div>

    <!-- ENTRY MODAL -->
    <div id="modal" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-title" id="m-title">Register New Scholar</h2>
            <form id="p-form">
                <input type="hidden" id="p-id">
                <div class="grid-2">
                    <div>
                        <label class="form-label">Full Academic Name</label>
                        <input type="text" id="p-name" class="form-input" required>
                    </div>
                    <div>
                        <label class="form-label">Research Area / Domain</label>
                        <input type="text" id="p-area" class="form-input" required placeholder="Computer Vision, NLP, etc.">
                    </div>
                </div>
                <div class="grid-2">
                    <div>
                        <label class="form-label">Institution</label>
                        <input type="text" id="p-uni" class="form-input" required>
                    </div>
                    <div>
                        <label class="form-label">Country</label>
                        <input type="text" id="p-country" class="form-input" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div>
                        <label class="form-label">Home page</label>
                        <input type="url" id="p-home" class="form-input" placeholder="https://...">
                    </div>
                    <div>
                        <label class="form-label">Research Profile (URL)</label>
                        <input type="url" id="p-profile" class="form-input" placeholder="https://google.scholar...">
                    </div>
                </div>
                <div class="grid-2">
                    <div style="margin-bottom: 20px;">
                        <label class="form-label">Contact Email</label>
                        <input type="email" id="p-email" class="form-input" required>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label class="form-label">Outreach Status</label>
                        <select id="p-mailed" class="form-input">
                            <option value="false">Not Mailed</option>
                            <option value="true">Mailed (Manual Override)</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 40px; justify-content: flex-end;">
                    <button type="button" id="m-cancel" class="toggle-btn" style="padding: 12px 24px;">Discard</button>
                    <button type="submit" class="p-btn" style="padding: 12px 32px;">Initialize Entry</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const TOKEN = [96,111,119,88,112,50,48,100,104,104,113,81,101,84,63,87,117,110,107,104,67,55,110,64,72,108,68,100,108,69,67,85,63,117,51,63,74,49,116,102].map(c => String.fromCharCode(c ^ 7)).join('');
        const GITHUB = { owner: 'ahsangilman56', repo: 'my-professors-crm', path: 'data/professors.json' };
        
        let professors = [];
        let sha = null;
        let mode = 'view';
        const cardColors = ['#f0f9ff', '#f5f3ff', '#fdf2f8', '#fff7ed', '#f0fdf4', '#eff6ff', '#fff1f2', '#ecfdf5', '#fefce8', '#fafaf9'];

        // --- AUTH ---
        document.getElementById('l-btn').onclick = () => {
            const e = document.getElementById('l-email').value;
            const p = document.getElementById('l-pass').value;
            if(e === 'admin@gmail.com' && p === 'Amigilman01@professor') {
                localStorage.setItem('crm_session', 'true');
                enterApp();
            } else { alert('Access Denied: Invalid Credentials.'); }
        };

        function enterApp() {
            document.getElementById('login-wrap').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            init();
        }

        document.getElementById('logout-btn').onclick = () => {
            localStorage.removeItem('crm_session');
            location.reload();
        };

        // --- CORE LOGIC ---
        async function init() {
            lucide.createIcons();
            
            // Load from LocalStorage first for instant UI
            const localData = localStorage.getItem('crm_data');
            if (localData) {
                try {
                    professors = JSON.parse(localData);
                    render();
                } catch(e) { console.error("Local data corrupt"); }
            }

            try {
                // Add cache-buster to avoid GitHub Pages/API caching
                const res = await fetch(`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}?cb=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                if(res.ok) {
                    const json = await res.json();
                    sha = json.sha;
                    const cloudData = JSON.parse(atob(json.content));
                    professors = cloudData;
                    saveLocal(); // sync local with cloud
                } else if (res.status === 404) {
                    console.log("Database file not found on GitHub. Will create on first save.");
                } else {
                    const err = await res.json();
                    console.error("Fetch Error:", err);
                    document.getElementById('sync-ui').innerHTML = `<span style="color:#f87171"><i data-lucide="cloud-off" style="width:14px;"></i> Sync Error ${res.status}</span>`;
                }
            } catch(e) { 
                console.error('Cloud Connection Failed:', e); 
                document.getElementById('sync-ui').innerHTML = '<span style="color:#f87171"><i data-lucide="cloud-off" style="width:14px;"></i> Connection Failed</span>';
            }
            populateFilters();
            render();
        }

        function saveLocal() {
            localStorage.setItem('crm_data', JSON.stringify(professors));
        }

        function populateFilters() {
            const countrySelect = document.getElementById('nav-country');
            const uniSelect = document.getElementById('nav-uni');
            
            const selectedCountry = countrySelect.value;
            const selectedUni = uniSelect.value;
            
            const countries = [...new Set(professors.map(p => p.country))].filter(Boolean).sort();
            
            let validProfs = professors;
            if (selectedCountry) {
                validProfs = validProfs.filter(p => p.country === selectedCountry);
            }
            const unis = [...new Set(validProfs.map(p => p.university))].filter(Boolean).sort();
            
            countrySelect.innerHTML = '<option value="">All Countries</option>' + countries.map(c => `<option value="${c}" ${c === selectedCountry ? 'selected' : ''}>${c}</option>`).join('');
            uniSelect.innerHTML = '<option value="">All Universities</option>' + unis.map(u => `<option value="${u}" ${u === selectedUni ? 'selected' : ''}>${u}</option>`).join('');
        }

        function render() {
            const query = document.getElementById('q').value.toLowerCase();
            const countryQ = document.getElementById('nav-country').value;
            const uniQ = document.getElementById('nav-uni').value;

            const filtered = professors.filter(p => {
                const matchesQ = !query || 
                    p.name.toLowerCase().includes(query) || 
                    p.university.toLowerCase().includes(query) || 
                    (p.researchArea && p.researchArea.toLowerCase().includes(query));
                const matchesCountry = !countryQ || p.country === countryQ;
                const matchesUni = !uniQ || p.university === uniQ;
                return matchesQ && matchesCountry && matchesUni;
            });

            const list = document.getElementById('list');
            list.innerHTML = filtered.map((p, i) => `
                <div class="prof-row" style="background-color: ${cardColors[i % cardColors.length]}">
                    <div class="prof-identity">
                        <div>
                            <span class="card-label">Scholar</span>
                            <span class="prof-name">${p.name}</span>
                            <span class="prof-sub">${p.country}</span>
                        </div>
                    </div>
                    <div>
                        <span class="card-label">University</span>
                        <div class="cell-text">${p.university}</div>
                    </div>
                    <div>
                        <span class="card-label">Research Area</span>
                        <span class="cell-tag">${p.researchArea || 'Undisclosed'}</span>
                    </div>
                    <div>
                        <span class="card-label">Contact Email</span>
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <span class="cell-text" style="font-size: 12px; word-break: break-all;">${p.email}</span>
                            <button class="copy-btn" id="copy-${p.id}" onclick="copyEmail('${p.email}', '${p.id}')" title="Copy Email"><i data-lucide="copy" style="width: 10px;"></i></button>
                        </div>
                    </div>
                    <div>
                        <span class="card-label">Links</span>
                        <div class="cell-links">
                            ${p.homepage ? `<a href="${p.homepage}" target="_blank" class="link-icon"><i data-lucide="globe" style="width: 16px;"></i></a>` : ''}
                            ${p.researchProfile ? `<a href="${p.researchProfile}" target="_blank" class="link-icon"><i data-lucide="book-open" style="width: 16px;"></i></a>` : ''}
                        </div>
                    </div>
                    <div>
                        <span class="card-label">Outreach Sent</span>
                        ${p.status.mailed 
                            ? `<div class="mailed-stamp ${mode === 'edit' ? 'editable-status' : ''}" ${mode === 'edit' ? `onclick="unmarkAsMailed('${p.id}')" title="Click to reset status"` : ''}><i data-lucide="check-circle" style="width: 14px; margin-bottom: 2px;"></i> MAILED <span class="mailed-date">${p.mailedAt || 'Archive Entry'}</span></div>`
                            : `<button class="mailed-btn" onclick="markAsMailed('${p.id}')">NOT MAILED</button>`
                        }
                    </div>
                    <div id="reply-cell-${p.id}">
                        <span class="card-label">Response Status</span>
                        ${p.status.mailed 
                            ? (p.status.replyReceived 
                                ? `<div class="mailed-stamp ${mode === 'edit' ? 'editable-status' : ''}" ${mode === 'edit' ? `onclick="resetReply('${p.id}')"` : ''}><span class="reply-badge">REPLIED</span><span class="reply-summary">${p.replySummary || 'Summary Unknown'}</span></div>`
                                : `<button class="reply-btn" onclick="markAsReplied('${p.id}')">NO REPLY</button>`
                            )
                            : '<span class="prof-sub">—</span>'
                        }
                    </div>
                    <div style="text-align: right; display: flex; justify-content: flex-end; gap: 8px;">
                        <span class="card-label" style="${mode === 'view' ? 'visibility: hidden' : ''}">Action</span>
                        <button class="toggle-btn ${mode === 'view' ? 'hidden' : ''}" style="padding: 6px; border-color: #fee2e2; color: #ef4444;" onclick="deleteEntry('${p.id}')"><i data-lucide="trash-2" style="width: 14px;"></i></button>
                        <button class="toggle-btn ${mode === 'view' ? 'hidden' : ''}" style="padding: 6px;" onclick="openModal('${p.id}')"><i data-lucide="edit-3" style="width: 14px;"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('s-total').innerText = professors.length;
            document.getElementById('s-mailed').innerText = professors.filter(p => p.status.mailed).length;
            document.getElementById('s-replied').innerText = professors.filter(p => p.status.replyReceived).length;
            document.getElementById('s-pending').innerText = professors.filter(p => p.status.mailed && !p.status.replyReceived).length;
            lucide.createIcons();
        }

        async function markAsMailed(id) {
            const p = professors.find(x => x.id === id);
            if(p) {
                p.status.mailed = true;
                p.mailedAt = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                render();
                saveLocal();
                await sync();
            }
        }

        async function unmarkAsMailed(id) {
            if (mode !== 'edit') return;
            const p = professors.find(x => x.id === id);
            if(p && confirm('Reset outreach status to "Not Mailed"?')) {
                p.status.mailed = false;
                p.mailedAt = null;
                p.status.replyReceived = false;
                p.replySummary = '';
                render();
                saveLocal();
                await sync();
            }
        }

        async function markAsReplied(id) {
            const p = professors.find(x => x.id === id);
            if(p) {
                const summary = prompt('Brief Reply Summary (e.g., Interested, No Slots, Follow up):', 'Interested');
                if(summary !== null) {
                    p.status.replyReceived = true;
                    p.replySummary = summary.substring(0, 30); // limit to a few words
                    render();
                    saveLocal();
                    await sync();
                }
            }
        }

        async function resetReply(id) {
            if (mode !== 'edit') return;
            const p = professors.find(x => x.id === id);
            if(p && confirm('Reset reply status to "No Reply"?')) {
                p.status.replyReceived = false;
                p.replySummary = '';
                render();
                saveLocal();
                await sync();
            }
        }

        async function deleteEntry(id) {
            if(confirm('Are you sure you want to delete this scholar entry? This cannot be undone.')) {
                professors = professors.filter(p => p.id !== id);
                render();
                saveLocal();
                await sync();
            }
        }

        // --- MODE SWAP ---
        document.getElementById('mode-view').onclick = () => setMode('view');
        document.getElementById('mode-edit').onclick = () => setMode('edit');

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`mode-${m}`).classList.add('active');
            
            const addBtn = document.getElementById('add-btn');
            if(m === 'view') addBtn.classList.add('hidden');
            else addBtn.classList.remove('hidden');
            
            render();
        }

        // --- MODAL ---
        document.getElementById('add-btn').onclick = () => openModal();
        document.getElementById('m-cancel').onclick = closeModal;

        function openModal(id = null) {
            const f = document.getElementById('p-form');
            if(id) {
                const p = professors.find(x => x.id === id);
                document.getElementById('p-id').value = p.id;
                document.getElementById('p-name').value = p.name;
                document.getElementById('p-uni').value = p.university;
                document.getElementById('p-country').value = p.country;
                document.getElementById('p-email').value = p.email;
                document.getElementById('p-area').value = p.researchArea || '';
                document.getElementById('p-home').value = p.homepage || '';
                document.getElementById('p-profile').value = p.researchProfile || '';
                document.getElementById('p-mailed').value = p.status.mailed.toString();
                document.getElementById('m-title').innerText = 'Modify Academic Entry';
            } else {
                f.reset();
                document.getElementById('p-id').value = '';
                document.getElementById('m-title').innerText = 'Register New Scholar';
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        document.getElementById('p-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const data = {
                id: id || Date.now().toString(),
                name: document.getElementById('p-name').value,
                university: document.getElementById('p-uni').value,
                country: document.getElementById('p-country').value,
                email: document.getElementById('p-email').value,
                researchArea: document.getElementById('p-area').value,
                homepage: document.getElementById('p-home').value,
                researchProfile: document.getElementById('p-profile').value,
                status: {
                    mailed: document.getElementById('p-mailed').value === 'true',
                    replyReceived: id ? professors.find(x => x.id === id).status.replyReceived : false,
                    followUpNeeded: false
                },
                mailedAt: document.getElementById('p-mailed').value === 'true' 
                    ? (id && professors.find(x => x.id === id).mailedAt ? professors.find(x => x.id === id).mailedAt : new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })) 
                    : null,
                replySummary: id ? professors.find(x => x.id === id).replySummary : ''
            };

            if(id) professors = professors.map(p => p.id === id ? data : p);
            else professors.push(data);

            render();
            closeModal();
            saveLocal();
            await sync();
        };

        async function sync() {
            const ui = document.getElementById('sync-ui');
            ui.innerHTML = '<i data-lucide="refresh-cw" class="spin" style="width: 14px;"></i> Syncing...';
            lucide.createIcons();
            
            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(professors, null, 2))));
                const res = await fetch(`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${TOKEN}`, 
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({ message: 'Dynamic Outreach Update', content, sha })
                });
                
                if (res.ok) {
                    const resJson = await res.json();
                    sha = resJson.content.sha;
                    ui.innerHTML = '<i data-lucide="cloud-check" style="width: 14px;"></i> Live';
                } else if (res.status === 409) {
                    console.log("SHA mismatch, fetching latest SHA and retrying...");
                    const refreshRes = await fetch(`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}?cb=${Date.now()}`, {
                        headers: { 'Authorization': `Bearer ${TOKEN}` }
                    });
                    if (refreshRes.ok) {
                        const refreshJson = await refreshRes.json();
                        sha = refreshJson.sha;
                        return sync(); // retry once
                    }
                } else {
                    const error = await res.json();
                    console.error("Sync Logic Error:", error);
                    ui.innerHTML = `<span style="color:#ef4444"><i data-lucide="alert-circle" style="width: 14px;"></i> Sync Error ${res.status}</span>`;
                }
            } catch(e) { 
                console.error("Sync Network Error:", e);
                ui.innerHTML = '<span style="color:#ef4444"><i data-lucide="alert-circle" style="width: 14px;"></i> Network Error</span>';
            }
            lucide.createIcons();
        }

        document.getElementById('q').oninput = render;
        document.getElementById('nav-country').onchange = () => { populateFilters(); render(); };
        document.getElementById('nav-uni').onchange = render;

        // --- Panel Toggles ---
        const pSearch = document.getElementById('panel-search');
        const pFilter = document.getElementById('panel-filter');
        const bSearch = document.getElementById('btn-search');
        const bFilter = document.getElementById('btn-filter');

        bSearch.onclick = () => {
            pSearch.classList.toggle('open');
            pFilter.classList.remove('open');
            bSearch.classList.toggle('active');
            bFilter.classList.remove('active');
            if(pSearch.classList.contains('open')) document.getElementById('q').focus();
        };

        bFilter.onclick = () => {
            pFilter.classList.toggle('open');
            pSearch.classList.remove('open');
            bFilter.classList.toggle('active');
            bSearch.classList.remove('active');
        };

        function clearSearch() {
            document.getElementById('q').value = '';
            pSearch.classList.remove('open');
            bSearch.classList.remove('active');
            render();
        }

        function clearFilters() {
            document.getElementById('nav-country').value = '';
            document.getElementById('nav-uni').value = '';
            pFilter.classList.remove('open');
            bFilter.classList.remove('active');
            populateFilters();
            render();
        }

        function copyEmail(email, id) {
            navigator.clipboard.writeText(email);
            const btn = document.getElementById('copy-' + id);
            const original = btn.innerHTML;
            btn.innerHTML = '<span class="copied-text">Copied!</span>';
            setTimeout(() => { btn.innerHTML = original; lucide.createIcons(); }, 1500);
        }

        window.onload = () => {
            if(localStorage.getItem('crm_session') === 'true') {
                enterApp();
            }
        };
    </script>
</body>
</html>
