<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhD Outreach Tracker | Gilman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --accent: #3b82f6;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #eab308;
  --purple: #a855f7;
  --cyan: #06b6d4;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}
h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
h2 { font-size: 16px; font-weight: 500; color: var(--text-dim); margin-bottom: 24px; }

/* World Clock */
.clock-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 32px; }
.clock-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
.clock-flag { font-size: 20px; margin-bottom: 4px; }
.clock-country { font-size: 12px; font-weight: 600; color: var(--text-dim); }
.clock-time { font-size: 20px; font-weight: 700; color: var(--cyan); margin-top: 4px; }
.clock-date { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
.stat-value { font-size: 32px; font-weight: 700; }
.stat-label { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.country-section { margin-bottom: 32px; }
.country-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.country-flag { font-size: 28px; }
.country-title { font-size: 20px; font-weight: 600; }
.country-count { background: var(--accent); padding: 2px 10px; border-radius: 10px; font-size: 13px; font-weight: 500; }
.uni-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; transition: border-color 0.2s; }
.uni-card:hover { border-color: var(--accent); }
.uni-info { flex: 1; }
.uni-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.uni-professors { font-size: 13px; color: var(--text-dim); }
.uni-professor { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.prof-name { font-size: 13px; font-weight: 500; }
.prof-date { font-size: 12px; color: var(--text-dim); margin-left: 8px; }
.uni-status { text-align: right; margin-left: 16px; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge-safe { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.badge-cooldown { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.badge-sent { background: rgba(168,85,247,0.15); color: var(--purple); border: 1px solid rgba(168,85,247,0.3); }
.badge-reply { background: rgba(234,179,8,0.15); color: var(--yellow); border: 1px solid rgba(234,179,8,0.3); }
.days-ago { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.reply-badge { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 6px; font-size: 11px; background: rgba(234,179,8,0.1); color: var(--yellow); }
.empty { text-align: center; padding: 40px; color: var(--text-dim); }
.loading { text-align: center; padding: 40px; color: var(--text-dim); }
.refresh-btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-left: 12px; font-family: inherit; }
.refresh-btn:hover { opacity: 0.85; }
@media (max-width: 600px) { .uni-card { flex-direction: column; align-items: flex-start; } .uni-status { margin-left: 0; margin-top: 8px; } .clock-grid { grid-template-columns: repeat(3, 1fr); } }

/* Refresh button */
.refresh-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 20px;
  transition: all 0.2s;
}
.refresh-btn:hover { background: #2563eb; transform: scale(1.02); }
.refresh-btn:active { transform: scale(0.98); }
.refresh-btn.loading { opacity: 0.6; pointer-events: none; }
.last-refresh { font-size: 11px; color: var(--text-dim); margin-left: 12px; }

/* Reply status badges */
.reply-positive { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.3); }
.reply-rejected { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
.reply-retired { background: rgba(148, 163, 184, 0.15); color: var(--text-dim); border: 1px solid rgba(148, 163, 184, 0.3); }
.reply-pending { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border: 1px solid rgba(234, 179, 8, 0.3); }
.reply-note {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
  padding: 6px 10px;
  background: rgba(59, 130, 246, 0.08);
  border-radius: 6px;
  border-left: 3px solid var(--accent);
}


/* Tabs */
.tab-bar { display: flex; gap: 10px; margin-bottom: 24px; }
.tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); padding: 10px 24px; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; transition: all 0.2s; }
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tab-section { display: none; }
.tab-section.visible { display: block; }

/* Draft explorer */
.draft-controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.draft-select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-family: inherit; font-size: 14px; min-width: 220px; }
.draft-hint { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
.prof-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.badge-drafted { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: rgba(59,130,246,0.15); color: var(--accent); border: 1px solid var(--accent); }
.badge-hold { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: rgba(234,179,8,0.15); color: var(--yellow); border: 1px solid var(--yellow); }
</style>
</head>
<body>
<h1>PhD Outreach Tracker <button class="refresh-btn" onclick="hardRefresh()">Refresh</button></h1>
<h2>Md Abu Ahsan Gilman | 7-Day Cooldown Rule Active</h2>


<div class="tab-bar">
  <button class="tab-btn active" id="tab-sent" onclick="switchTab('sent')">📤 Sent</button>
  <button class="tab-btn" id="tab-drafts" onclick="switchTab('drafts')">📝 Draft</button>
</div>

<div class="tab-section visible" id="section-sent">
<div class="clock-grid" id="clocks"></div>
<div class="stats-grid" id="stats"></div>
<div id="content"><div class="loading">Loading data...</div></div>
</div>

<div class="tab-section" id="section-drafts">
  <div class="draft-controls">
    <select class="draft-select" id="sel-country" onchange="onCountryChange()"><option value="">Select Country...</option></select>
    <select class="draft-select" id="sel-uni" onchange="onUniChange()" disabled><option value="">Select University...</option></select>
  </div>
  <div class="draft-hint">Pick a country, then a university, to see which professors have mail ready (drafted).</div>
  <div id="draft-list"></div>
</div>

<script>
const COOLDOWN_DAYS = 7;
const DATA_URL = 'https://raw.githubusercontent.com/ahsangilman56/my-professors-crm/main/outreach_tracker.json';

const CLOCK_ZONES = [
  { country: 'USA', tz: 'America/New_York', flag: '🇺🇸' },
  { country: 'UK', tz: 'Europe/London', flag: '🇬🇧' },
  { country: 'Canada', tz: 'America/Toronto', flag: '🇨🇦' },
  { country: 'Australia', tz: 'Australia/Sydney', flag: '🇦🇺' },
  { country: 'Netherlands', tz: 'Europe/Amsterdam', flag: '🇳🇱' },
  { country: 'Germany', tz: 'Europe/Berlin', flag: '🇩🇪' },
  { country: 'Sweden', tz: 'Europe/Stockholm', flag: '🇸🇪' },
  { country: 'Denmark', tz: 'Europe/Copenhagen', flag: '🇩🇰' },
  { country: 'Switzerland', tz: 'Europe/Zurich', flag: '🇨🇭' },
  { country: 'Finland', tz: 'Europe/Helsinki', flag: '🇫🇮' },
];

function updateClocks() {
  const container = document.getElementById('clocks');
  let html = '';
  for (const c of CLOCK_ZONES) {
    const now = new Date();
    const time = now.toLocaleTimeString('en-US', { timeZone: c.tz, hour: '2-digit', minute: '2-digit', hour12: true });
    const date = now.toLocaleDateString('en-US', { timeZone: c.tz, weekday: 'short', month: 'short', day: 'numeric' });
    html += `<div class="clock-card">
      <div class="clock-flag">${c.flag}</div>
      <div class="clock-country">${c.country}</div>
      <div class="clock-time">${time}</div>
      <div class="clock-date">${date}</div>
    </div>`;
  }
  container.innerHTML = html;
}

function daysSince(dateStr) {
  if (!dateStr) return 999;
  const sent = new Date(dateStr + 'T00:00:00Z');
  const now = new Date();
  return Math.floor((now - sent) / 86400000);
}

function formatDate(d) {
  if (!d) return '';
  const parts = d.split('-');
  return `${parts[1]}/${parts[2]}/${parts[0]}`;
}

function getCountryFlag(country) {
  const flags = { 'USA': '🇺🇸', 'Finland': '🇫🇮', 'Australia': '🇦🇺', 'Spain': '🇪🇸' };
  return flags[country] || '🌍';
}

let isLoading = false;
async function load() {
  if (isLoading) return;
  isLoading = true;
  const urls = [
    DATA_URL + '?t=' + Date.now(),
    'https://cdn.jsdelivr.net/gh/ahsangilman56/my-professors-crm@main/outreach_tracker.json?t=' + Date.now()
  ];
  
  for (const url of urls) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const real = data.filter(e => e.university && e.dateSent);
      render(real);
      initDraftExplorer(data);
      console.log('Loaded from:', url);
      return;
    } catch(e) {
      console.warn('Fetch failed for', url, ':', e.message);
      continue;
    }
  }
  
  // All sources failed
  document.getElementById('content').innerHTML = '<div class="empty">Unable to load data from any source. Check network or try again later.</div>';
  document.getElementById('stats').innerHTML = '';
} finally {
    isLoading = false;
  }
}

function render(entries) {
  const totalSent = entries.filter(e => e.dateSent).length;
  const countries = {};
  const unis = {};
  entries.forEach(e => {
    if (!countries[e.country]) countries[e.country] = 0;
    countries[e.country] = (countries[e.country] || 0) + 1;
    if (!unis[e.university]) unis[e.university] = [];
    unis[e.university].push(e);
  });
  const uniCount = Object.keys(unis).filter(u => unis[u].length > 0).length;
  const replyCount = entries.filter(e => e.status && e.status.startsWith('replied')).length;
  const inCooldown = Object.keys(unis).filter(u => {
    const sentProfs = unis[u].filter(p => p.dateSent);
    if (!sentProfs.length) return false;
    const latest = sentProfs.sort((a,b) => b.dateSent.localeCompare(a.dateSent))[0];
    return daysSince(latest.dateSent) < COOLDOWN_DAYS;
  }).length;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-value" style="color:var(--accent)">${totalSent}</div><div class="stat-label">Emails Sent</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--green)">${uniCount}</div><div class="stat-label">Universities Mailed</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--yellow)">${replyCount}</div><div class="stat-label">Replies Received</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--red)">${inCooldown}</div><div class="stat-label">In 7-Day Cooldown</div></div>
  `;

  const byCountry = {};
  entries.filter(e => e.dateSent).forEach(e => {
    if (!byCountry[e.country]) byCountry[e.country] = {};
    if (!byCountry[e.country][e.university]) byCountry[e.country][e.university] = [];
    byCountry[e.country][e.university].push(e);
  });

  if (Object.keys(byCountry).length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty">No emails sent yet. Data will appear here after the first email is sent.</div>';
    return;
  }

  let html = '';
  for (const [country, unis] of Object.entries(byCountry)) {
    html += `<div class="country-section"><div class="country-header"><span class="country-flag">${getCountryFlag(country)}</span><span class="country-title">${country}</span><span class="country-count">${Object.keys(unis).length} universities</span></div>`;
    
    const sortedUnis = Object.entries(unis).sort((a, b) => {
      const aLatest = a[1].filter(p=>p.dateSent).sort((x,y) => y.dateSent.localeCompare(x.dateSent))[0] || {};
      const bLatest = b[1].filter(p=>p.dateSent).sort((x,y) => y.dateSent.localeCompare(x.dateSent))[0] || {};
      const aDays = daysSince(aLatest.dateSent);
      const bDays = daysSince(bLatest.dateSent);
      if (aDays < COOLDOWN_DAYS && bDays >= COOLDOWN_DAYS) return -1;
      if (aDays >= COOLDOWN_DAYS && bDays < COOLDOWN_DAYS) return 1;
      return aDays - bDays;
    });

    for (const [uni, profs] of sortedUnis) {
      const sentProfs = profs.filter(p=>p.dateSent);
      if (!sentProfs.length) continue;
      const latest = sentProfs.sort((a,b) => b.dateSent.localeCompare(a.dateSent))[0];
      const days = daysSince(latest.dateSent);
      const inCool = days < COOLDOWN_DAYS;
      const remaining = COOLDOWN_DAYS - days;
      const badge = inCool 
        ? `<span class="badge badge-cooldown">⏳ ${remaining}d left</span>` 
        : `<span class="badge badge-safe">✅ Safe to mail</span>`;
      const daysText = `<div class="days-ago">${days === 0 ? 'Today' : days + ' day' + (days > 1 ? 's' : '') + ' ago'}</div>`;

      let profHtml = '';
      for (const p of sentProfs.sort((a,b) => b.dateSent.localeCompare(a.dateSent))) {
        let replyTag = '';
        let replyNoteHtml = '';
        if (p.status && p.status.startsWith('replied')) {
          let badgeClass = 'reply-pending';
          let badgeText = '💬 Reply';
          if (p.status.includes('positive')) { badgeClass = 'reply-positive'; badgeText = '✅ Positive Reply'; }
          else if (p.status.includes('rejected')) { badgeClass = 'reply-rejected'; badgeText = '❌ Rejected'; }
          else if (p.status.includes('retired')) { badgeClass = 'reply-retired'; badgeText = '🚫 Retired'; }
          else if (p.status.includes('auto')) { badgeClass = 'reply-pending'; badgeText = '⏳ Auto-reply'; }
          replyTag = `<span class="badge ${badgeClass}">${badgeText}</span>`;
          if (p.replyNote) replyNoteHtml = `<div class="reply-note">${p.replyNote}</div>`;
        }
        profHtml += `<div class="uni-professor"><span class="prof-name">${p.name}</span><span class="prof-date">${formatDate(p.dateSent)}</span>${replyTag}</div>${replyNoteHtml}`;
      }

      html += `<div class="uni-card">
        <div class="uni-info">
          <div class="uni-name">${uni}</div>
          ${profHtml}
        </div>
        <div class="uni-status">${badge}${daysText}</div>
      </div>`;
    }
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

function updateLastRefresh() {
  const now = new Date();
  const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  document.getElementById('lastRefresh').textContent = 'Last updated: ' + time;
}

async function hardRefresh() {
  const btn = document.querySelector('.refresh-btn');
  btn.classList.add('loading');
  btn.textContent = '🔄 Loading...';
  await load();
  btn.classList.remove('loading');
  btn.textContent = '🔄 Refresh Data';
  updateLastRefresh();
}

updateClocks();
load();
updateLastRefresh();
setInterval(updateClocks, 1000);
setInterval(load, 300000);


let ALL_DATA = [];

function switchTab(tab) {
  document.getElementById('tab-sent').classList.toggle('active', tab==='sent');
  document.getElementById('tab-drafts').classList.toggle('active', tab==='drafts');
  document.getElementById('section-sent').classList.toggle('visible', tab==='sent');
  document.getElementById('section-drafts').classList.toggle('visible', tab==='drafts');
}

let draftInitPending = false;
function initDraftExplorer(data) {
  if (draftInitPending) return;
  draftInitPending = true;
  setTimeout(() => {
    draftInitPending = false;
    ALL_DATA = data.filter(e => e.status === 'draft');
  const selC = document.getElementById('sel-country');
  const countries = [...new Set(ALL_DATA.map(e => e.country).filter(Boolean))].sort();
  for (const c of countries) {
    const opt = document.createElement('option'); opt.value = c; opt.textContent = getCountryFlag(c)+' '+c;
    selC.appendChild(opt);
  }
}

function onCountryChange() {
  const c = document.getElementById('sel-country').value;
  const selU = document.getElementById('sel-uni');
  const listDiv = document.getElementById('draft-list');
  selU.innerHTML = '<option value="">Select University...</option>';
  selU.disabled = !c;
  listDiv.innerHTML = '';
  if (!c) return;
  const unis = [...new Set(ALL_DATA.filter(e=>e.country===c).map(e=>e.university))].sort();
  for (const u of unis) {
    const opt = document.createElement('option'); opt.value = u; opt.textContent = u;
    selU.appendChild(opt);
  }
  selU.disabled = false;
}

function onUniChange() {
  const c = document.getElementById('sel-country').value;
  const u = document.getElementById('sel-uni').value;
  const listDiv = document.getElementById('draft-list');
  if (!u) { listDiv.innerHTML=''; return; }
  const profs = ALL_DATA.filter(e=>e.country===c && e.university===u).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  let h = '';
  for (const p of profs) {
    const holdBadge = p.sendAfter
      ? `<span class="badge-hold">⏸ Hold until ${p.sendAfter}</span>`
      : `<span class="badge-drafted">📝 Drafted</span>`;
    h += `<div class="prof-card"><div><strong>${p.name}</strong>${p.subject?`<div style="font-size:12px;color:var(--text-dim);margin-top:3px">${p.subject}</div>`:''}</div><div>${holdBadge}</div></div>`;
  }
  if (!h) h = '<div class="empty">No drafted professors at this university.</div>';
  listDiv.innerHTML = h;
}
</script>
</body>
</html>
